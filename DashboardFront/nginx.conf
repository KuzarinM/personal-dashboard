server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Любой путь -> index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    location ~ ^/geo-proxy/(.*)$ {
        
        set $ip_address $1;
        proxy_pass https://api.ip.sb/geoip/$ip_address;

        # Маскируемся под браузер
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        
        # Очищаем заголовки и разрешаем CORS для нашего фронта
        proxy_hide_header 'Access-Control-Allow-Origin';
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Статика кешируется
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }


}